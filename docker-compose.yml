# docker compose up --build  →  http://localhost:8000/docs
# .env의 OPENAI_API_KEY를 앱 컨테이너에 전달한다. DB 접속 정보는 컨테이너 네트워크 기준으로 덮어쓴다.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: contractflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: contractflow
    # 호스트의 설치형 PostgreSQL(5432)·로컬 개발 DB(5433)와 겹치지 않게 5434로 노출한다.
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 최초 기동 시 1회만 실행됨 (테스트용 DB 생성)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractflow -d contractflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://contractflow:${POSTGRES_PASSWORD:-change-me}@db:5432/contractflow
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
